<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | HomeTaste Kitchen</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-bg"><img src="./WhatsApp Image 2026-08-07 at 10.50.50 AM.jpeg" alt="Kitchen background"></div>
    <div class="auth-card">
      <h2>Admin Login</h2>
      <p>Sign in to manage menu, bookings, and pricing.</p>
      <form id="adminLoginForm">
        <div class="form-field"><label>Username</label><input type="text" name="username" placeholder="admin" required></div>
        <div class="form-field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <a href="index.html" class="auth-back">← Back to Website</a>
    </div>
  </div>
  <script src="admin.js"></script>

</body></html>
